<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IPTV Proxy Console</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg"></div>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Local Control Plane</p>
          <h1>IPTV Proxy Console</h1>
          <p class="lede">Configure your playlist sources, enforce a single active stream, and keep a clean audit trail.</p>
        </div>
        <div class="badge">Node Proxy</div>
      </header>

      <section class="grid">
        <div class="card">
          <h2>Source Config</h2>
          <label>
            M3U playlist URL
            <input id="m3uUrl" type="url" placeholder="https://provider.example/playlist.m3u" />
          </label>
          <label>
            EPG URL
            <input id="epgUrl" type="url" placeholder="https://provider.example/epg.xml" />
          </label>
          <label>
            Allowed hosts (comma-separated, optional)
            <input id="allowedHosts" type="text" placeholder="cdn.example.com, stream.example.com" />
          </label>
          <label>
            Max concurrent streams
            <input id="maxStreams" type="number" min="1" value="1" />
          </label>
          <label class="inline">
            <input id="cacheEnabled" type="checkbox" />
            Enable memory cache
          </label>
          <label>
            Cache size (MB)
            <input id="cacheMaxMb" type="number" min="1" value="50" />
          </label>
          <label>
            Over-limit image URL (optional)
            <input id="denyImageUrl" type="text" placeholder="https://example.com/too-many.png or data:image/png;base64,..." />
          </label>
          <label>
            Upload PNG/JPEG (optional)
            <input id="denyImageFile" type="file" accept="image/png,image/jpeg" />
          </label>
          <div class="row">
            <button id="uploadDenyImage" class="ghost">Upload Image</button>
            <button id="clearDenyImage" class="ghost">Clear Upload</button>
            <button id="regenerateDenyVideo" class="ghost">Regenerate Video</button>
          </div>
          <div class="preview">
            <img id="denyImagePreview" alt="Deny image preview" />
          </div>
          <div class="row">
            <button id="saveConfig" class="primary">Save</button>
            <button id="refreshConfig" class="ghost">Reload</button>
          </div>
          <div class="meta" id="configStatus">No config loaded yet.</div>
          <div class="meta" id="ffmpegStatus"></div>
          <div class="meta" id="cacheStatus"></div>
        </div>

        <div class="card">
          <div class="row">
            <h2>Clients</h2>
            <button id="refreshClients" class="ghost">Refresh</button>
          </div>
          <label>
            New client name
            <input id="newClientName" type="text" placeholder="Living room TV" />
          </label>
          <button id="createClient" class="primary">Create Client</button>
          <div id="clientList" class="client-list">No clients yet.</div>
        </div>
      </section>

      <section>
        <div class="card logs logs-wide">
          <div class="row">
            <h2>Recent Logs</h2>
            <button id="refreshLogs" class="ghost">Refresh</button>
          </div>
          <div id="logList" class="log-list">No logs yet.</div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
